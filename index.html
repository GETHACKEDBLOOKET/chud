<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs</title>
    <!-- Imports a clean sans-serif font family -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; height: 100%; overflow: hidden; 
            background: linear-gradient(to bottom, #140526 0%, #010114 100%);
            font-family: 'Product Sans', 'Google Sans', system-ui, sans-serif;
            display: flex; flex-direction: column;
        }

        /* Synthwave Navbar Custom Styles */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #0d021a; padding: 12px 20px;
            border-bottom: 3px solid #ff007f; box-shadow: 0px 0px 15px #ff007f; z-index: 10;
        }

        .title {
            color: #00ffff; font-weight: 700; font-size: 1.4rem;
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 10px #00ffff;
        }

        .nav-buttons { display: flex; gap: 10px; }

        .btn {
            background: transparent; border: 2px solid #ff007f; color: #ff007f;
            padding: 8px 16px; font-family: inherit; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; border-radius: 4px; text-transform: uppercase;
            transition: all 0.3s ease; box-shadow: 0 0 5px #ff007f;
        }

        .btn:hover, .btn.active {
            background-color: #ff007f; color: #fff;
            box-shadow: 0 0 15px #ff007f, 0 0 25px #ff007f;
        }

        .btn.search-btn { border-color: #00ffff; color: #00ffff; box-shadow: 0 0 5px #00ffff; }
        .btn.search-btn:hover { background-color: #00ffff; color: #000; box-shadow: 0 0 15px #00ffff; }

        .container { flex-grow: 1; width: 100%; height: 100%; position: relative; }
        iframe { width: 100%; height: 100%; border: none; background: transparent; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="title">Dashboard</div>
        <div class="nav-buttons">
            <!-- These links use the proxy prefix syntax to cleanly process the traffic -->
            <button class="btn search-btn" onclick="loadSite('https://www.google.com')">Google</button>
            <button class="btn" onclick="loadSite('https://roblox.com')">Roblox</button>
            <button class="btn" onclick="loadSite('https://www.tiktok.com')">TikTok</button>
        </div>
    </div>

    <div class="container">
        <!-- Defaults to the main proxy interface screen -->
        <iframe id="proxy-frame" src="https://rublconxray.com"></iframe>
    </div>

    <script>
        // Adjust this if your current proxy link changes or gets blocked
        const PROXY_BASE = "https://rublconxray.commain/"; 

        function loadSite(targetUrl) {
            const frame = document.getElementById('proxy-frame');
            // Formats the URL through the proxy's internal routing engine
            frame.src = PROXY_BASE + btoa(targetUrl); 
        }
    </script>
</body>
</html>
